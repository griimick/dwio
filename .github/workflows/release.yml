name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dwio
          key: drawio-webapp-${{ hashFiles('src/assets.ts') }}
      - name: Cache the draw.io editor (export tests use it)
        run: bun src/cli.ts setup
      - run: bun run check
      - name: Tag must match package.json version
        run: test "v$(bun -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: bun run build:all
      - name: Checksums
        run: cd dist-bin && sha256sum dwio-* > SHA256SUMS
      - name: Publish release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "$GITHUB_REF_NAME" dist-bin/* --title "$GITHUB_REF_NAME" --generate-notes

  # Publishes to npm via trusted publishing (OIDC, no token). Enabled by setting the repo variable NPM_PUBLISH=true
  # after the one-time setup described in the README ("Publish to npm").
  npm:
    needs: release
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: bun install --frozen-lockfile
      - run: npm publish --provenance --access public   # the prepack script builds dist/cli.js
