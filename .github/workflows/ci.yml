name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Standalone binary builds and runs
        run: |
          bun run build
          ./dist-bin/dwio-linux-x64 --version
          ./dist-bin/dwio-linux-x64 xml examples/flow.drawio.svg | grep -q 'vertex="1"'
