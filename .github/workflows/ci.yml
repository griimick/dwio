name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dwio
          key: drawio-webapp-${{ hashFiles('src/assets.ts') }}
      - name: Cache the draw.io editor (export tests use it)
        run: bun src/cli.ts setup
      - run: bun run check
      - name: Standalone binary builds and runs
        run: |
          bun run build
          ./dist-bin/dwio-linux-x64 --version
          ./dist-bin/dwio-linux-x64 xml examples/flow.drawio.svg | grep -q 'vertex="1"'
      - name: npm bundle runs on Node
        run: |
          bun run build:npm
          node dist/cli.js --version
          node dist/cli.js xml examples/flow.drawio.svg | grep -q 'vertex="1"'
