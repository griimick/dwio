<style>
  :root { color-scheme: light dark; --bg: #fff; --card: #fff; --fg: #222; --line: #c8c8c8; --err: #cf222e; --ok: #1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --card: #2b2b2b; --fg: #e6e6e6; --line: #555; --err: #f85149; --ok: #3fb950; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  #toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 10; max-width: min(380px, calc(100vw - 28px)); }
  .toast { font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 6px; padding: 8px 12px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
  .toast.error { border-left-color: var(--err); }
  .toast .row { display: flex; gap: 8px; margin-top: 8px; }
  .toast button { font: inherit; padding: 2px 10px; cursor: pointer; }
</style>
</head>

<iframe id="editor" title="draw.io editor"></iframe>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="/host.js"></script>
